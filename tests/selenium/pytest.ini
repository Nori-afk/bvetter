[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    testcase(tc_id, feature, expected, category, role): binds a test to a Test Case ID from the plan
    functional: Functionality Testing test cases (TC-**-F**)
    performance: Performance Testing test cases (TC-**-P**)
    security: Security Testing test cases (TC-**-S**)
    usability: Usability Testing test cases (TC-**-U**)
    owner: Pet Owner role
    vet: Veterinarian role
    admin: Admin role
    system: Deployment-level checks that are not tied to one role
    mutating: Writes data to the database (skipped with --no-mutate)
    needs_cdn: Needs internet for a CDN library (Chart.js / Leaflet / FullCalendar)
